<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1558d6" />
  <meta name="description" content="Produzir Registra — registro simples e confiável da produção." />
  <title>Produzir Registra</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="app-header" id="app-header">
      <div class="header-inner">
        <div class="brand" aria-label="Produzir Registra">
          <div class="brand-mark" aria-hidden="true">PR</div>
          <div>
            <p class="eyebrow">Óris 360 · Produção</p>
            <h1>Produzir Registra</h1>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="network-status" type="button" aria-label="Status da conexão" title="Status da conexão">
            <span class="status-dot" aria-hidden="true"></span>
          </button>
          <button class="avatar-button" id="user-menu-button" type="button" aria-label="Usuário" hidden>
            <span id="user-avatar">U</span>
          </button>
        </div>
      </div>
      <div class="motivation-strip" id="motivation-strip" hidden>
        <span id="motivation-text"></span>
      </div>
    </header>

    <main id="app-main" tabindex="-1" aria-live="polite"></main>

    <nav class="primary-nav" id="primary-nav" aria-label="Navegação principal" hidden></nav>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div class="modal-root" id="modal-root"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
